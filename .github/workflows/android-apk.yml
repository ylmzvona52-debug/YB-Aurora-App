name: Veron Vera Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip"

permissions:
  contents: read

jobs:
  build:
    name: Android APK oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur ve önbelleği hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK lisanslarını kabul et
        run: yes | sdkmanager --licenses || true

      - name: Kaynak ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Kaynak ZIP dosyası bulunamadı: $ZIP_FILE"
            echo "Depodaki ZIP dosyaları:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          mkdir -p /tmp/aurora
          unzip -o "$ZIP_FILE" -d /tmp/aurora

          echo "ZIP dosyası başarıyla açıldı."
          find /tmp/aurora -maxdepth 3 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find /tmp/aurora -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android projesi bulunamadı."
            find /tmp/aurora -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android projesi: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Android APK dosyasını derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Oluşturulan APK dosyasını kontrol et
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK oluşturulamadı veya beklenen konumda bulunamadı."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK başarıyla bulundu: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: APK dosyasını indirilebilir olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
