name: YB Aurora APK Derle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Uygulamasi
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: true

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK lisanslarini kabul et
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "::error::Android SDK lisanslari kabul edilemedi."
            exit "$SDK_STATUS"
          fi

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android proje ayarlari bulunamadi."
            find . -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Proje dizini: $PROJECT"

      - name: Android proje dosyalarini kontrol et
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts \
            || test -f settings.gradle

          test -f build.gradle.kts \
            || test -f build.gradle

          test -f app/build.gradle.kts \
            || test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          echo "Gerekli proje dosyalari bulundu."

      - name: APK derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: APK dosyasini bul ve hazirla
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Derleme sonrasi APK bulunamadi."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/YB-Aurora-debug.apk

          echo "APK dosyasi hazir."
          ls -lh apk-output/YB-Aurora-debug.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
