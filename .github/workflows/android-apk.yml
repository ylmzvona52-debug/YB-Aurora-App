name: Veron Vera Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip"

permissions:
  contents: read

jobs:
  build:
    name: Android APK oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur ve önbelleği hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Kaynak ZIP dosyasını bul ve aç
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Kaynak ZIP dosyası depo kökünde bulunamadı."
            echo "Aranan dosya: $ZIP_FILE"
            echo "Depodaki ZIP dosyaları:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 \
              -type f -name '*.zip' -print
            exit 1
          fi

          mkdir -p /tmp/aurora
          unzip -o "$ZIP_FILE" -d /tmp/aurora

          echo "ZIP başarıyla açıldı."

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find /tmp/aurora -type f \
              \( -name 'settings.gradle' \
                 -o -name 'settings.gradle.kts' \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle dosyası bulunamadı."
            echo "ZIP içindeki dosyalar:"
            find /tmp/aurora -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Proje kökünde build.gradle dosyası bulunamadı."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android proje yolu: $PROJECT_DIR"
          echo "Proje dosyaları:"
          ls -la "$PROJECT_DIR"

      - name: Android SDK platformunu kontrol et
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          echo "Kurulu Android SDK platformları:"
          sdkmanager --list_installed

          echo "Android proje yapılandırması bulundu."
          echo "Derleme sırasında eksik SDK bileşenleri"
          echo "oluşursa gerçek hata günlüğü gösterilecektir."

      - name: Android APK dosyasını derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Projenin kendi Gradle Wrapper dosyası kullanılacak."
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug

          elif [ -f "../gradlew" ]; then
            echo "Üst dizindeki Gradle Wrapper kullanılacak."
            chmod +x ../gradlew
            ../gradlew --no-daemon -p "$PROJECT_DIR" assembleDebug

          else
            echo "Gradle Wrapper bulunamadı."
            echo "Kurulu Gradle sürümü:"
            gradle --version

            gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          fi

      - name: APK dosyasını bul ve doğrula
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK_FILE="$(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Derleme tamamlandı ancak debug APK bulunamadı."
            echo "Bulunan APK dosyaları:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            echo "Derleme çıktı dizinleri:"
            find "$PROJECT_DIR" -type d \
              -path '*/build/outputs/*' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-artifact"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-artifact/"

          echo "APK dosyası bulundu:"
          ls -lh "$GITHUB_WORKSPACE/apk-artifact"

      - name: APK dosyasını indirilebilir olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
          retention-days: 7
