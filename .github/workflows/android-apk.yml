name: YB Aurora APK Derle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK aracini bul
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK bulunamadi."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadi."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK bulundu."

      - name: Android SDK lisanslarini kabul et
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          set -o pipefail
          echo "SDK lisans adimi tamamlandi."

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Android kaynak ZIP dosyasini bul
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for FILE in ./*.zip; do
            [ -f "$FILE" ] || continue

            if unzip -Z1 "$FILE" 2>/dev/null |
              grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::Android proje dosyalarini iceren ZIP bulunamadi."
            echo "Depodaki ZIP dosyalari:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Kaynak ZIP bulundu: $ZIP"

      - name: Kaynak ZIP dosyasini ac
        shell: bash
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/aurora

          unzip -o "$SOURCE_ZIP" -d /tmp/aurora

          echo "Kaynak dosyalari acildi."

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find /tmp/aurora -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle dosyasi bulunamadi."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android projesi: $PROJECT"

      - name: Android proje dosyalarini kontrol et
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f app/build.gradle.kts ] &&
             [ ! -f app/build.gradle ]; then
            echo "::error::app Gradle dosyasi bulunamadi."
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml bulunamadi."
            exit 1
          fi

          echo "Android proje dosyalari kontrol edildi."

      - name: APK derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: APK dosyasini bul ve hazirla
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find /tmp/aurora -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Derleme tamamlandi ancak APK bulunamadi."
            find /tmp/aurora -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/YB-Aurora-debug.apk

          echo "Olusturulan APK:"
          ls -lh apk-output/YB-Aurora-debug.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
