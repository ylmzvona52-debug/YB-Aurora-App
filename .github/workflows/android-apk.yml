name: "YB Aurora APK Derle"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Android APK Uygulamasi"
    runs-on: ubuntu-24.04

    steps:
      - name: "Depoyu indir"
        uses: actions/checkout@v4

      - name: "Java 17 kur"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Gradle kur"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Android SDK kur"
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: "true"

      - name: "Android SDK lisanslarini kabul et"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true

      - name: "Kaynak ZIP dosyasini bul ve ac"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/aurora

          ZIP=""

          for candidate in \
            "YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip" \
            "YB_Aurora_Android_Uygulama_Kaynak.zip" \
            "YB_Aurora_Android_Uygulama_Kaynak(1).zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi bulunamadi."
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Kullanilan kaynak: $ZIP"
          unzip -o "$ZIP" -d /tmp/aurora

          echo "Kaynak dosyalari acildi."

      - name: "Android projesini bul"
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(
            find /tmp/aurora -type f \
              \( -name "settings.gradle.kts" \
              -o -name "settings.gradle" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle ayar dosyasi bulunamadi."
            find /tmp/aurora -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Android app modulu bulunamadi."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml bulunamadi."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Proje dizini: $PROJECT"

      - name: "Arama XML hatasini duzelt"
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("/tmp/aurora")

          manifests = list(
              root.rglob("app/src/main/AndroidManifest.xml")
          )

          android_ns = (
              "http://schemas.android.com/apk/res/android"
          )

          ET.register_namespace("android", android_ns)

          def android_attr(name):
              return "{" + android_ns + "}" + name

          for manifest in manifests:
              print(f"Manifest kontrol ediliyor: {manifest}")

              try:
                  tree = ET.parse(manifest)
              except ET.ParseError as exc:
                  raise SystemExit(
                      f"Manifest XML hatasi: {exc}"
                  )

              document = tree.getroot()
              application = document.find("application")

              if application is None:
                  continue

              removed = 0

              for element in list(application):
                  if element.tag != "service":
                      continue

                  service_name = element.get(
                      android_attr("name"), ""
                  )

                  metadata_resources = [
                      item.get(android_attr("resource"), "")
                      for item in element.findall("meta-data")
                  ]

                  is_call_service = (
                      "InCallService" in service_name
                      or any(
                          "in_call_service" in resource
                          for resource in metadata_resources
                      )
                  )

                  if is_call_service:
                      print(
                          "Gecici Manifest kopyasindan "
                          "arama hizmeti kaldiriliyor: "
                          + service_name
                      )
                      application.remove(element)
                      removed += 1

              if removed:
                  tree.write(
                      manifest,
                      encoding="utf-8",
                      xml_declaration=True
                  )
                  print(
                      f"Kaldirilan arama hizmeti: {removed}"
                  )
              else:
                  print(
                      "Manifest icinde eslesen arama "
                      "hizmeti bulunamadi."
                  )

          xml_files = list(
              root.rglob(
                  "app/src/main/res/xml/in_call_service.xml"
              )
          )

          for xml in xml_files:
              print(
                  "Hatali XML dosyasi gecici kopyadan "
                  f"kaldiriliyor: {xml}"
              )
              xml.unlink()

          print("Arama XML kontrolu tamamlandi.")
          PY

      - name: "Gradle ve Android ayarlarini kontrol et"
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Java surumu:"
          java -version

          echo "Gradle surumu:"
          gradle --version

          echo "Android proje dizini:"
          pwd

      - name: "APK derle"
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: "APK dosyasini bul ve kontrol et"
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find /tmp/aurora -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK dosyasi olusturulamadi."
            find /tmp/aurora -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/YB-Aurora-debug.apk

          if [ ! -s apk-output/YB-Aurora-debug.apk ]; then
            echo "::error::APK dosyasi bos."
            exit 1
          fi

          echo "APK dosyasi hazir:"
          ls -lh apk-output/YB-Aurora-debug.apk

      - name: "APK dosyasini yayinla"
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
