name: "YB Aurora APK Derle"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Android APK Uygulamasi"
    runs-on: ubuntu-24.04

    steps:
      - name: "Depoyu indir"
        uses: actions/checkout@v4

      - name: "Java 17 kur"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Gradle kur"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Android SDK kur"
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: "true"

      - name: "Android SDK lisanslarini kabul et"
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true

      - name: "Kaynak ZIP dosyasini bul ve ac"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/aurora

          ZIP=""

          for candidate in \
            "YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip" \
            "YB_Aurora_Android_Uygulama_Kaynak.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi bulunamadi."
            echo "Depodaki ZIP dosyalari:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Kullanilan kaynak: $ZIP"

          unzip -o "$ZIP" -d /tmp/aurora

          echo "ZIP icerigi:"
          find /tmp/aurora -maxdepth 4 -type f -print

      - name: "Android projesini dogrula"
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(
            find /tmp/aurora -type f \
              \( -name "settings.gradle.kts" \
              -o -name "settings.gradle" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle veya settings.gradle.kts bulunamadi."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Android app modulu bulunamadi."
            find "$PROJECT" -maxdepth 5 -type f -print
            exit 1
          fi

          if [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml bulunamadi."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

          echo "Proje dizini: $PROJECT"

      - name: "Hatali arama XML dosyasini kontrol et"
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          root = Path("/tmp/aurora")

          xml_files = list(
              root.rglob(
                  "app/src/main/res/xml/in_call_service.xml"
              )
          )

          if not xml_files:
              print(
                  "in_call_service.xml bulunamadi. "
                  "XML temizleme adimi gerekmiyor."
              )
              sys.exit(0)

          manifests = list(
              root.rglob("app/src/main/AndroidManifest.xml")
          )

          for xml in xml_files:
              referenced = False

              for manifest in manifests:
                  content = manifest.read_text(
                      encoding="utf-8"
                  )

                  if "in_call_service" in content:
                      referenced = True
                      print(
                          "Manifest referansi bulundu: "
                          f"{manifest}"
                      )

              if referenced:
                  print(
                      "HATA: Arama XML dosyasi Manifest "
                      "tarafindan referans ediliyor."
                  )
                  print(
                      "Dosya otomatik silinmedi. "
                      "Arama hizmeti yapilandirmasi "
                      "birlikte duzeltilmeli."
                  )
                  sys.exit(1)

              print(
                  "Kullanilmayan XML dosyasi kaldiriliyor: "
                  f"{xml}"
              )
              xml.unlink()

          print("XML kontrolu tamamlandi.")
          PY

      - name: "Android APK derle"
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: "APK dosyasini bul ve dogrula"
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find /tmp/aurora -type f \
              -path "*/build/outputs/apk/debug/*.apk" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK olusturulamadi."
            find /tmp/aurora -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/YB-Aurora-debug.apk

          test -s apk-output/YB-Aurora-debug.apk

          echo "APK basariyla bulundu."
          ls -lh apk-output/YB-Aurora-debug.apk

      - name: "APK dosyasini yayinla"
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
