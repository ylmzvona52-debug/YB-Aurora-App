
name: "YB Aurora APK Derle"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Olustur
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK lisanslarini kabul et
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Kaynak ZIP dosyasini kontrol et ve ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP="YB_Aurora_Android_Uygulama_Kaynak.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi depo ana dizininde bulunamadi."
            exit 1
          fi

          mkdir -p /tmp/aurora
          unzip -o "$ZIP" -d /tmp/aurora

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find /tmp/aurora -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android projesinin settings.gradle dosyasi bulunamadi."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/gradlew" ] && \
             [ ! -f "$PROJECT/build.gradle" ] && \
             [ ! -f "$PROJECT/build.gradle.kts" ]; then
            echo "::error::Gradle proje dosyalari bulunamadi."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Bulunan proje: $PROJECT"
          ls -la "$PROJECT"

      - name: APK derle
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: APK dosyasini bul
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find /tmp/aurora -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Derleme tamamlandi ancak APK bulunamadi."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/YB-Aurora-debug.apk"

          echo "APK hazir: $APK"

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
