
      - name: Java ve Kotlin hedeflerini duzelt
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("/tmp/aurora")
          candidates = []

          for path in list(root.rglob("build.gradle.kts")) + list(root.rglob("build.gradle")):
              text = path.read_text(encoding="utf-8")

              # Ana Gradle dosyasini atla.
              # Yalnizca gercek android blogu olan modulleri sec.
              if re.search(r'\bandroid\s*\{', text):
                  candidates.append(path)

          if not candidates:
              print("Android blogu bulunan modul dosyasi bulunamadi.")
              sys.exit(1)

          changed = 0

          for path in candidates:
              text = path.read_text(encoding="utf-8")
              original = text

              # Java hedefini 17 yap.
              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              # Kotlin hedefi 1.8 ise 17 yap.
              text = re.sub(
                  r"""(jvmTarget\s*=\s*)["'](?:1\.8|8)["']""",
                  r'\1"17"',
                  text
              )

              # Android blogunu bul.
              match = re.search(r'\bandroid\s*\{', text)
              opening = text.find("{", match.start())
              depth = 1
              pos = opening + 1

              while pos < len(text) and depth:
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                  pos += 1

              if depth != 0:
                  print(f"Android blogu kapanmiyor: {path}")
                  sys.exit(1)

              end = pos - 1
              block = text[opening + 1:end]

              # Var olan compileOptions blogunu kaldir.
              co = re.search(r'\bcompileOptions\s*\{', block)

              if co:
                  co_open = block.find("{", co.start())
                  d = 1
                  p = co_open + 1

                  while p < len(block) and d:
                      if block[p] == "{":
                          d += 1
                      elif block[p] == "}":
                          d -= 1
                      p += 1

                  if d != 0:
                      print(f"compileOptions blogu hatali: {path}")
                      sys.exit(1)

                  block = block[:co.start()] + block[p:]

              # Her iki Gradle DSL icin Java 17 ayari.
              block = (
                  "\n    compileOptions {\n"
                  "        sourceCompatibility = JavaVersion.VERSION_17\n"
                  "        targetCompatibility = JavaVersion.VERSION_17\n"
                  "    }\n"
                  + block
              )

              text = text[:opening + 1] + block + text[end:]

              # Kotlin hedefi yoksa, modul dosyasina uygun gorev ekle.
              if not re.search(r'\bjvmTarget\s*=', text):
                  if path.name == "build.gradle.kts":
                      text += (
                          "\n\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>()"
                          ".configureEach {\n"
                          '    kotlinOptions.jvmTarget = "17"\n'
                          "}\n"
                      )
                  else:
                      text += (
                          "\n\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile)"
                          ".configureEach {\n"
                          '    kotlinOptions.jvmTarget = "17"\n'
                          "}\n"
                      )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed += 1

              print(f"Kontrol edildi: {path}")

          if changed == 0:
              print("Hicbir modul dosyasi degismedi; hedef ayarlari kontrol edilmeli.")
              sys.exit(1)

          print(f"Duzenlenen Android modul dosyasi: {changed}")
          PY
