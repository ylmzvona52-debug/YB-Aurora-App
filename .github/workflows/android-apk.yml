content = r'''name: YB Aurora APK Derle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: YB Aurora Android APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK aracini bul
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager bulunamadi."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Android SDK lisanslarini kabul et
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          set -o pipefail

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Android kaynak ZIP dosyasini bul
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for FILE in ./*.zip; do
            [ -f "$FILE" ] || continue

            if unzip -Z1 "$FILE" 2>/dev/null |
              grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::Android proje ZIP dosyasi bulunamadi."
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Kaynak ZIP dosyasini ac
        shell: bash
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/aurora
          unzip -o "$SOURCE_ZIP" -d /tmp/aurora

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find /tmp/aurora -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android proje ayarlari bulunamadi."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Java ve Kotlin hedeflerini duzelt
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle.kts bulunamadi."
            exit 1
          fi

          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.yb.aurora"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.yb.aurora"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GRADLE

      - name: Android proje dosyalarini kontrol et
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: APK derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: APK dosyasini hazirla
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find /tmp/aurora -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Derleme sonrasi APK bulunamadi."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/YB-Aurora-debug.apk
          ls -lh apk-output/YB-Aurora-debug.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
'''
path = "/mnt/data/android-apk.yml"
with open(path, "w", encoding="utf-8") as f:
    f.write(content)
print(f"Dosya oluşturuldu: {path}\nSatır sayısı: {len(content.splitlines())}")
