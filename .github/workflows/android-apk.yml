name: "YB Aurora APK Derle"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Uygulamasi
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Kaynak ZIP dosyasini ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP="YB_Aurora_Android_Uygulama_Kaynak_DUZELTILMIS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi bulunamadi: $ZIP"
            echo "Depodaki ZIP dosyalari:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          mkdir -p /tmp/aurora
          unzip -o "$ZIP" -d /tmp/aurora

          echo "Kaynak ZIP acildi."

      - name: Gecersiz arama XML dosyasini kontrol et
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          root = Path("/tmp/aurora")

          xml_files = list(
              root.rglob("app/src/main/res/xml/in_call_service.xml")
          )

          if not xml_files:
              print("in_call_service.xml bulunamadi; bu adim atlandi.")
              sys.exit(0)

          manifests = list(
              root.rglob("app/src/main/AndroidManifest.xml")
          )

          for xml in xml_files:
              referenced = False

              for manifest in manifests:
                  content = manifest.read_text(
                      encoding="utf-8"
                  )

                  if "in_call_service" in content:
                      referenced = True
                      print(
                          "Manifest dosyasinda arama hizmeti "
                          f"referansi bulundu: {manifest}"
                      )

              if referenced:
                  print(
                      "HATA: XML dosyasi Manifest tarafindan "
                      "referans ediliyor."
                  )
                  print(
                      "Dosya otomatik silinmedi. "
                      "Manifest ve XML birlikte duzeltilmeli."
                  )
                  sys.exit(1)

              print(f"Kullanilmayan XML dosyasi kaldiriliyor: {xml}")
              xml.unlink()

          print("XML kontrolu tamamlandi.")
          PY

      - name: Android
