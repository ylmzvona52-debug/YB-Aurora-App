
name: "YB Aurora APK Derle"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Uygulamasi
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Kaynak ZIP dosyasini ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP="YB_Aurora_Android_Uygulama_Kaynak.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi bulunamadi."
            exit 1
          fi

          mkdir -p /tmp/aurora
          unzip -o "$ZIP" -d /tmp/aurora

      - name: Java ve Kotlin hedeflerini duzelt
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("/tmp/aurora")
          files = list(root.rglob("build.gradle.kts"))
          files += list(root.rglob("build.gradle"))

          android_files = []

          for path in files:
              text = path.read_text(encoding="utf-8")
              if re.search(r'\bandroid\s*\{', text):
                  android_files.append(path)

          if not android_files:
              print("Android modulunun Gradle dosyasi bulunamadi.")
              sys.exit(1)

          changed = 0

          for path in android_files:
              text = path.read_text(encoding="utf-8")
              original = text

              # Java 8 hedeflerini Java 17 yap.
              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              # Kotlin jvmTarget hedefini 17 yap.
              text = re.sub(
                  r"""(jvmTarget\s*=\s*)["'](?:1\.8|8)["']""",
                  r'\1"17"',
                  text
              )

              # Eski Kotlin DSL hedef bildirimlerini de ele al.
              text = re.sub(
                  r'JvmTarget\.JVM_1_8\b',
                  'JvmTarget.JVM_17',
                  text
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed += 1
                  print(f"Guncellendi: {path}")
              else:
                  print(f"Degisiklik gerekmiyor: {path}")

          print(f"Kontrol edilen Android dosyasi: {len(android_files)}")
          print(f"Degistirilen dosya: {changed}")
          PY

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find /tmp/aurora -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle dosyasi bulunamadi."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/build.gradle" ]; then
            echo "::error::Ana Gradle dosyasi bulunamadi."
            exit 1
          fi

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Proje bulundu: $PROJECT"

      - name: APK derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: APK dosyasini bul
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find /tmp/aurora -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK dosyasi bulunamadi."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/YB-Aurora-debug.apk
          echo "APK dosyasi hazir."

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
