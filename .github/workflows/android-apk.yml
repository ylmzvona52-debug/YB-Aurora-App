name: YB Aurora APK Derle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Uygulamasi
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9 kur
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Kaynak ZIP dosyasini bul ve ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 4 -type f \
            -iname '*Kaynak*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi bulunamadi."
            echo "Depodaki ZIP dosyalari:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Bulunan kaynak: $ZIP"

          mkdir -p /tmp/aurora
          unzip -o "$ZIP" -d /tmp/aurora

          echo "Kaynak dosyalari acildi."

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find /tmp/aurora -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android proje ayarlari bulunamadi."
            find /tmp/aurora -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Proje dizini: $PROJECT"

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle ve kaynaklari kontrol et
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          echo "Gradle surumu:"
          gradle --version

          echo "Android proje dosyalari:"
          cd "$PROJECT_DIR"

          test -f settings.gradle.kts \
            || test -f settings.gradle

          test -f app/build.gradle.kts \
            || test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          echo "Temel proje dosyalari bulundu."

      - name: APK derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: APK dosyasini bul
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find /tmp/aurora -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Derleme tamamlandi ancak APK bulunamadi."
            find /tmp/aurora -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" \
            apk-output/YB-Aurora-debug.apk

          echo "APK hazirlandi."

          ls -lh apk-output/YB-Aurora-debug.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
