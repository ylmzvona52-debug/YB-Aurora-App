
name: "YB Aurora APK Derle"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Uygulamasi
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Kaynak ZIP dosyasini ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP="YB_Aurora_Android_Uygulama_Kaynak.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Kaynak ZIP dosyasi bulunamadi."
            exit 1
          fi

          mkdir -p /tmp/aurora
          unzip -o "$ZIP" -d /tmp/aurora

      - name: Java hedeflerini duzelt
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("/tmp/aurora")
          files = list(root.rglob("build.gradle.kts"))
          files += list(root.rglob("build.gradle"))
          count = 0

          for path in files:
              text = path.read_text(encoding="utf-8")

              if not re.search(r'\bandroid\s*\{', text):
                  continue

              original = text

              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'(?m)^(\s*jvmTarget\s*=\s*)["\'](?:1\.8|8)["\']',
                  r'\1"17"',
                  text
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  count += 1
                  print(f"Guncellendi: {path}")

          print(f"Degistirilen modul dosyasi: {count}")
          PY

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find /tmp/aurora -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle dosyasi bulunamadi."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Proje: $PROJECT"

      - name: Gerekli Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.dir }}"

          SDKMANAGER="$(command -v sdkmanager)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadi."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          # Projenin Android API ve build-tools surumlerini bul.
          python3 - "$PROJECT" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          texts = []

          for name in ("build.gradle", "build.gradle.kts"):
              for path in root.rglob(name):
                  texts.append(path.read_text(encoding="utf-8"))

          text = "\n".join(texts)

          api = re.search(
              r'\bcompileSdk(?:Version)?\s*(?:=\s*)?(\d+)',
              text
          )

          build_tools = re.search(
              r'buildToolsVersion\s*(?:=\s*)?["\']([^"\']+)',
              text
          )

          api_version = api.group(1) if api else "35"

          packages = [
              "platform-tools",
              f"platforms;android-{api_version}"
          ]

          if build_tools:
              packages.append(f"build-tools;{build_tools.group(1)}")

          Path("/tmp/android-packages.txt").write_text(
              "\n".join(packages) + "\n",
              encoding="utf-8"
          )

          print("Kurulacak SDK paketleri:")
          print("\n".join(packages))
          PY

          while IFS= read -r package; do
            [ -n "$package" ] || continue
            sdkmanager --install "$package"
          done < /tmp/android-packages.txt

      - name: APK derle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: APK dosyasini bul
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find /tmp/aurora -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK dosyasi bulunamadi."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/YB-Aurora-debug.apk
          echo "APK hazir."

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-debug-APK
          path: apk-output/YB-Aurora-debug.apk
          if-no-files-found: error
          retention-days: 7
